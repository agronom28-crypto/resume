<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обновление страницы</title><style>html,body{margin:0;min-height:100%;font:16px/1.5 system-ui;background:#f7f8fa;color:#101828}.state{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px}.dot{width:32px;height:32px;border:3px solid #d0d5dd;border-top-color:#465fff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main id="app" class="state"><div><div class="dot"></div><strong>Загружаем страницу…</strong></div></main><script>(async()=>{try{const names=Array.from({length:12},(_,i)=>'./ai-training-parts/part-'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(n);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('app').innerHTML='<div><h1>Страница временно недоступна</h1><p>Обновите страницу через несколько секунд.</p></div>'}})();</script></body></html>
