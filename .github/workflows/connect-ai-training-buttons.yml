name: Connect AI training buttons

on:
  push:
    branches: [main]
    paths:
      - _tools/connect-ai-training-buttons.py
      - .github/workflows/connect-ai-training-buttons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect controls without changing layout
        run: python _tools/connect-ai-training-buttons.py
      - name: Remove temporary automation and commit page
        run: |
          rm -f _tools/connect-ai-training-buttons.py
          rm -f .github/workflows/connect-ai-training-buttons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Connect AI training buttons and navigation"
          git push
