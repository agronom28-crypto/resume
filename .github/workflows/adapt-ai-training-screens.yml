name: Adapt AI training screens

on:
  push:
    branches: [main]
    paths:
      - _tools/adapt-ai-training-screens.py
      - .github/workflows/adapt-ai-training-screens.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add responsive layer
        run: python _tools/adapt-ai-training-screens.py
      - name: Validate responsive layer
        run: |
          grep -q 'id="responsive-screen-adapter"' ai-training.html
          grep -q '@media (max-width:560px)' ai-training.html
          grep -q '@media (max-width:390px)' ai-training.html
      - name: Remove temporary automation and commit page
        run: |
          rm -f _tools/adapt-ai-training-screens.py
          rm -f .github/workflows/adapt-ai-training-screens.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adapt AI training page for tablet and mobile screens"
          git push
