name: Finalize AI training page

on:
  push:
    branches: [main]
    paths:
      - _tools/finalize-ai-training.py
      - .github/workflows/finalize-ai-training.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current page
        run: python _tools/finalize-ai-training.py
      - name: Commit optimized page
        run: |
          if git diff --quiet -- ai-training.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-training.html
          git commit -m "Finalize AI training interactions and performance"
          git push
