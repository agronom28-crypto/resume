name: Adapt AI training hero to reference

on:
  push:
    branches: [main]
    paths:
      - _tools/adapt-ai-training-hero.py
      - .github/workflows/adapt-ai-training-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hero reference layout
        run: python _tools/adapt-ai-training-hero.py
      - name: Validate hero rules
        run: |
          grep -q 'Hero reference layout' ai-training.html
          grep -q 'min-height:calc(100svh - 84px)' ai-training.html
          grep -q 'font-size:clamp(64px,4.4vw,86px)' ai-training.html
      - name: Remove temporary automation and commit
        run: |
          rm -f _tools/adapt-ai-training-hero.py
          rm -f .github/workflows/adapt-ai-training-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match AI training hero proportions to reference"
          git push
