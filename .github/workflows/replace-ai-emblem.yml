name: Replace AI header emblem

on:
  push:
    branches: [main]
    paths:
      - _tools/replace-ai-emblem.py
      - .github/workflows/replace-ai-emblem.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace text emblem with SVG
        run: python _tools/replace-ai-emblem.py
      - name: Validate SVG reference
        run: |
          grep -q 'assets/ai-training/ai-emblem-44x44.svg' ai-training.html
          ! grep -q '<span class="logo">AI</span>' ai-training.html
      - name: Remove temporary automation and commit
        run: |
          rm -f _tools/replace-ai-emblem.py
          rm -f .github/workflows/replace-ai-emblem.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use original SVG emblem in AI training header"
          git push
