name: Fix AI training hero heading only

on:
  push:
    branches: [main]
    paths:
      - _tools/fix-ai-training-hero-heading.py
      - .github/workflows/fix-ai-training-hero-heading.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original hero width and adjust heading
        run: python _tools/fix-ai-training-hero-heading.py
      - name: Validate correction
        run: |
          grep -q 'Hero heading height only' ai-training.html
          ! grep -q 'width:min(1648px' ai-training.html
          ! grep -q 'min-height:calc(100svh - 84px)' ai-training.html
      - name: Remove temporary automation and commit
        run: |
          rm -f _tools/fix-ai-training-hero-heading.py
          rm -f .github/workflows/fix-ai-training-hero-heading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore hero width and adjust heading height"
          git push
