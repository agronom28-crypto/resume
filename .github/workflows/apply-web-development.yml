name: Apply web development section

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-web-development.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          old_desc = 'Python-разработка, backend, FastAPI, AI/RAG, Telegram-боты, парсеры, API, CRM, n8n, базы данных, DevOps, Moodle, MVP и внутренние IT-системы для бизнеса.'
          new_desc = 'Python-разработка, сайты под ключ, дизайн и адаптивная вёрстка, backend, FastAPI, AI/RAG, Telegram-боты, API, CRM, n8n и внутренние IT-системы для бизнеса.'
          s = s.replace(old_desc, new_desc)

          nav_old = '<a href="#services">Услуги</a><a href="/resume/cases/">'
          nav_new = '<a href="#services">Услуги</a><a href="/resume/web-development/">Сайты</a><a href="/resume/cases/">'
          if '/resume/web-development/">Сайты</a>' not in s:
              if nav_old not in s:
                  raise SystemExit('Navigation insertion point not found')
              s = s.replace(nav_old, nav_new, 1)

          card = '''<div class="package-card web-service-card">
          <div class="service-icon">WEB</div>
          <h3 class="package-name">Сайты под ключ</h3>
          <div class="package-includes"><strong>Результат:</strong> быстрый, понятный и адаптивный сайт, который представляет бизнес и приводит обращения.</div>
          <ul class="service-list"><li>Структура, прототип и дизайн интерфейса.</li><li>Адаптивная вёрстка для телефона, планшета и компьютера.</li><li>Frontend, backend, формы, базы данных и API-интеграции.</li><li>Базовая SEO-подготовка, публикация и дальнейшая поддержка.</li></ul>
          <div class="web-stack" aria-label="Языки и технологии"><span>HTML5</span><span>CSS3</span><span>JavaScript</span><span>Python</span><span>PHP</span><span>SQL</span><span>React</span><span>Next.js</span><span>FastAPI</span><span>Django</span><span>PostgreSQL</span></div>
          <a class="service-link" href="/resume/web-development/">Подробнее о разработке сайтов →</a>
          </div>
          '''
          if 'class="package-card web-service-card"' not in s:
              needle = '<div class="packages-grid">\n'
              if needle not in s:
                  raise SystemExit('Services grid insertion point not found')
              s = s.replace(needle, needle + card, 1)

          css = '''<style id="web-service-card-style">
          .web-service-card{grid-column:1/-1!important;display:grid!important;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr)!important;column-gap:34px!important;align-items:start!important;background:linear-gradient(135deg,#f8f9ff 0%,#f1f4ff 100%)!important;border-color:#cbd4ee!important}
          .web-service-card .service-icon,.web-service-card .package-name,.web-service-card .package-includes,.web-service-card .service-list{grid-column:1}.web-service-card .web-stack,.web-service-card .service-link{grid-column:2}
          .web-service-card .web-stack{grid-row:1/5;align-self:center;display:flex;flex-wrap:wrap;gap:8px;padding:24px;border:1px solid #dce3f0;border-radius:10px;background:rgba(255,255,255,.78)}
          .web-stack span{padding:7px 10px;border:1px solid #d8dfec;border-radius:5px;background:#fff;color:#465269;font-size:13px;font-weight:700}.web-service-card .service-link{justify-self:start;margin-top:18px}
          @media(max-width:760px){.web-service-card{display:block!important}.web-service-card .web-stack{margin:20px 0 4px;padding:18px}.web-service-card .service-link{width:100%}}
          </style>'''
          if 'id="web-service-card-style"' not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          index.write_text(s, encoding='utf-8')

          page = Path('web-development/index.html')
          page.parent.mkdir(parents=True, exist_ok=True)
          page.write_text('''<!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Разработка сайтов под ключ — Сергей Николаенко</title>
          <meta name="description" content="Дизайн, адаптивная вёрстка, frontend, backend, SEO и запуск сайтов под ключ. Страница направления находится в разработке.">
          <meta name="robots" content="index,follow"><link rel="canonical" href="https://agronom28-crypto.github.io/resume/web-development/"><meta name="theme-color" content="#253047">
          <style>
          :root{--ink:#253047;--copy:#566176;--line:#dce3ee;--paper:#fff;--wash:#f4f6fb;--accent:#667eea;--accent2:#764ba2;--shadow:0 24px 70px rgba(37,48,71,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#edf1f7;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;line-height:1.65}a{color:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:18px;top:18px;z-index:10;padding:10px 14px;background:var(--ink);color:#fff;border-radius:6px}.shell{width:min(1120px,calc(100% - 40px));margin:34px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 54px;border-bottom:1px solid var(--line);background:#fafbfe}.brand{font-size:14px;font-weight:800;letter-spacing:.04em;text-decoration:none}.back{display:inline-flex;min-height:44px;align-items:center;padding:0 15px;border:1px solid #cfd7e5;border-radius:6px;background:#fff;color:#445066;font-size:14px;font-weight:700;text-decoration:none}.hero{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr);gap:58px;align-items:center;padding:84px 64px 72px}.eyebrow{display:inline-block;margin-bottom:18px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.status{display:inline-flex;align-items:center;gap:9px;margin-left:12px;padding:6px 10px;border:1px solid #d9dff0;border-radius:999px;background:var(--wash);color:#59657a;font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}.dot{width:8px;height:8px;border-radius:50%;background:#667eea;box-shadow:0 0 0 5px rgba(102,126,234,.12);animation:pulse 2s infinite}h1{max-width:760px;margin:0 0 22px;font-size:clamp(40px,6.2vw,74px);line-height:1.02;letter-spacing:-.052em}h1 em{color:var(--accent);font-style:normal}.lead{max-width:650px;margin:0;color:var(--copy);font-size:18px;line-height:1.8}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:0 20px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;text-decoration:none;transition:transform .18s ease,background .18s ease}.button:hover{background:#586dd7;transform:translateY(-2px)}.button.secondary{background:#fff;color:var(--ink);border-color:#cfd7e5}.panel{position:relative;padding:34px;border:1px solid #d8e0ed;border-radius:12px;background:linear-gradient(145deg,#fff,#f7f8fc);box-shadow:0 18px 42px rgba(37,48,71,.09);overflow:hidden}.panel:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}.panel-label{font-size:12px;color:#7a8496;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.progress{height:8px;margin:20px 0 12px;border-radius:99px;background:#e8ecf4;overflow:hidden}.progress span{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:loading 2.8s ease-in-out infinite}.progress-copy{display:flex;justify-content:space-between;color:#687389;font-size:13px}.checklist{display:grid;margin-top:28px;border-top:1px solid var(--line)}.check{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;color:#4e5a70}.check b{color:var(--accent);font-size:12px}.stack{padding:60px 64px 70px;background:#fafbfe;border-top:1px solid var(--line)}.stack h2{margin:0 0 12px;font-size:clamp(28px,4vw,43px);line-height:1.12;letter-spacing:-.035em}.stack p{max-width:720px;margin:0;color:var(--copy)}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}.chips span{padding:9px 12px;border:1px solid #d8dfec;border-radius:5px;background:#fff;color:#465269;font-size:13px;font-weight:700}.note{margin-top:30px;padding:18px 20px;border:1px solid #dce2f0;border-radius:8px;background:#fff;color:#566176}.note strong{color:var(--ink)}footer{padding:26px 64px;background:var(--ink);color:#c6cddd;font-size:13px}footer a{color:#fff}@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(102,126,234,.04)}}@keyframes loading{0%,100%{width:32%}50%{width:58%}}@media(max-width:820px){.shell{width:min(100% - 24px,1120px);margin:12px auto}.topbar{padding:18px 24px}.hero{grid-template-columns:1fr;padding:58px 32px;gap:40px}.stack{padding:50px 32px}footer{padding:26px 32px}}@media(max-width:520px){body{background:#fff}.shell{width:100%;margin:0;border:0;border-radius:0;box-shadow:none}.topbar{padding:15px 18px}.brand{font-size:12px}.back{padding:0 11px}.hero{padding:48px 20px}.eyebrow{line-height:2}.status{margin-left:0}.lead{font-size:16px}.actions,.button{width:100%}.panel{padding:25px 20px}.stack{padding:44px 20px}footer{padding:24px 20px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style></head><body><a class="skip" href="#main">К содержанию</a><div class="shell"><header class="topbar"><a class="brand" href="/resume/">СЕРГЕЙ НИКОЛАЕНКО</a><a class="back" href="/resume/">← На главную</a></header><main id="main"><section class="hero"><div><span class="eyebrow">Новое направление</span><span class="status"><i class="dot"></i> Страница формируется</span><h1>Создаю сайты, которые <em>решают задачу</em></h1><p class="lead">Проектирую структуру и дизайн, выполняю адаптивную вёрстку, разрабатываю frontend и backend, подключаю формы, базы данных и API. Готовлю сайт к поисковому продвижению, публикации и дальнейшему развитию.</p><div class="actions"><a class="button" href="https://t.me/nsv_01" target="_blank" rel="noopener noreferrer">Обсудить сайт в Telegram</a><a class="button secondary" href="mailto:rj2biz@mail.ru?subject=Разработка сайта">Написать на почту</a></div></div><aside class="panel" aria-label="Статус страницы"><div class="panel-label">Подготовка раздела</div><div class="progress" aria-hidden="true"><span></span></div><div class="progress-copy"><span>Структура и материалы</span><b>в работе</b></div><div class="checklist"><div class="check"><span>Описание услуг</span><b>ГОТОВО</b></div><div class="check"><span>Примеры интерфейсов</span><b>ГОТОВЯТСЯ</b></div><div class="check"><span>Кейсы и результаты</span><b>СЛЕДУЮЩИЙ ЭТАП</b></div></div></aside></section><section class="stack"><h2>Дизайн, код и запуск</h2><p>Подбираю технологии под масштаб и задачу проекта. Ниже — языки и инструменты, которые применяю для разработки сайтов и web-сервисов.</p><div class="chips" aria-label="Языки и технологии"><span>HTML5</span><span>CSS3</span><span>JavaScript</span><span>Python</span><span>PHP</span><span>SQL</span><span>React</span><span>Next.js</span><span>FastAPI</span><span>Django</span><span>PostgreSQL</span><span>REST API</span><span>Git</span><span>Docker</span></div><div class="note"><strong>Раздел дополняется.</strong> Уже сейчас можно прислать задачу: я уточню цели, предложу структуру сайта и подходящий первый этап.</div></section></main><footer>© Сергей Николаенко · <a href="/resume/contacts/">Контакты</a></footer></div></body></html>''', encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          if '/resume/web-development/' not in sm:
              sm = sm.replace('</urlset>', '''  <url>
            <loc>https://agronom28-crypto.github.io/resume/web-development/</loc>
            <lastmod>2026-09-18</lastmod>
            <changefreq>weekly</changefreq>
            <priority>0.8</priority>
          </url>
          </urlset>''')
              sitemap.write_text(sm, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Perplexity AI"
          git config user.email "noreply@perplexity.ai"
          git add index.html sitemap.xml web-development/index.html
          git commit -m "Добавить направление разработки сайтов"
          git push
