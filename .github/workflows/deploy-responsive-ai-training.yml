name: Deploy responsive AI training page

on:
  push:
    branches: [main]
    paths:
      - _tools/deploy-responsive-ai-training.py
      - .github/workflows/deploy-responsive-ai-training.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace fixed canvas with semantic responsive page
        run: python _tools/deploy-responsive-ai-training.py
      - name: Validate result
        run: |
          test $(wc -c < ai-training.html) -lt 50000
          grep -q 'assets/ai-training/hero-training.png' ai-training.html
          grep -q 'assets/ai-training/team-session.png' ai-training.html
          grep -q '@media(max-width:680px)' ai-training.html
          ! grep -q 'transform:matrix' ai-training.html
      - name: Remove temporary automation and commit
        run: |
          rm -f _tools/deploy-responsive-ai-training.py
          rm -f .github/workflows/deploy-responsive-ai-training.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace AI training canvas with responsive semantic page"
          git push
